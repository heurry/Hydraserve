version: '3.8'

services:
  hydraserve:
    build: .
    image: hydraserve:latest
    container_name: hydraserve
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - HYDRA_MODE=pd_disaggregated
      - HYDRA_MODEL=/models/Qwen3.5-9B-AWQ
      - HYDRA_PREFILL_GPU=0
      - HYDRA_DECODE_GPU=1
    ports:
      - "8000:8000"
    volumes:
      - /path/to/models:/models           # Replace with actual model path
      - ./benchmark_output:/app/HydraServe/benchmark_output
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 2
              capabilities: [gpu]
    shm_size: '16gb'
    command:
      - python
      - -m
      - hydraserve.serve.serve
      - --model
      - /models/Qwen3.5-9B-AWQ
      - --model-name
      - Qwen3.5-9B
      - --mode
      - pd_disaggregated
      - --prefill-gpu
      - "0"
      - --decode-gpu
      - "1"
      - --host
      - "0.0.0.0"
      - --port
      - "8000"

  # Optional: vLLM baseline for comparison
  # vllm-baseline:
