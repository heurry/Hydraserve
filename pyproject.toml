[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hydraserve"
version = "0.1.0"
description = "A PD-disaggregated inference engine prototype for hybrid-attention LLMs"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "safetensors>=0.4"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5"]
gpu = ["torch>=2.1", "triton>=2.1"]
prefill = ["flash-attn>=2.5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "gpu: requires a CUDA device",
    "slow: loads a real checkpoint or performs a long-running test",
]

[tool.setuptools.packages.find]
include = ["hydraserve*"]
